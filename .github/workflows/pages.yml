# Publishes the web installer to GitHub Pages: the page from site/ plus the stock Tasmota bootloader,
# partition table and safeboot for the USB fallback (ota.tasmota.com has no CORS). The gPlug firmware is
# closed source and never hosted: users pick the file the gPlug team sent them.
name: Deploy web installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        run: |
          scripts/build.sh
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Separate job: deploy-pages looks the artifact up by name right away, and in the same job that
  # lookup ran ~0.4 s after the upload finished and found nothing (the run's artifact list is not
  # updated yet). The job boundary gives it time.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
